<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="description" content="Quick party games with friends. Open link, type code, play. 31 games, no app, no sign-up.">

<meta property="og:description" content="Join my room and play on your phone. No app, no sign-up.">

<style>
@font-face { font-family:"Bricolage Grotesque"; src:url(/fonts/bricolage.woff2) format("woff2"); font-weight:700 800; font-display:swap; }

/* ───── tokens ───── */
:root, [data-theme=dark] {
  color-scheme:dark;
  --bg:#0b0d12; --card:#141822; --raised:#1b2030; --line:#252b3b; --line2:#333b52;
  --fg:#eef1f7; --muted:#8e96aa; --accent:#ffd23f; --accent-fg:#1d1600; --accent-soft:#ffd23f22;
  --danger:#fb7185; --ok:#34d399; --glow1:#3a2a8a55; --glow2:#0e4a6a44;
  --shadow:0 1px 0 #ffffff0d inset, 0 12px 32px -14px #000c;
}
[data-theme=dim] { /* class mode: low light, no glow */
  color-scheme:dark;
  --bg:#050506; --card:#0c0d10; --raised:#111317; --line:#1a1c21; --line2:#24272e;
  --fg:#9a9ca3; --muted:#5d6068; --accent:#a3862a; --accent-fg:#050506; --accent-soft:#a3862a22;
  --danger:#a05050; --ok:#3f7a52; --glow1:transparent; --glow2:transparent; --shadow:none;
}
[data-theme=light] {
  color-scheme:light;
  --bg:#f4f5f9; --card:#ffffff; --raised:#ffffff; --line:#e1e4ec; --line2:#cdd2de;
  --fg:#131620; --muted:#5d6475; --accent:#f5b800; --accent-fg:#1d1600; --accent-soft:#f5b80026;
  --danger:#e11d48; --ok:#059669; --glow1:#c4b5fd55; --glow2:#7dd3fc44;
  --shadow:0 1px 2px #0000000f, 0 10px 28px -16px #1e293b40;
}
:root { --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif; --c-solo:#38bdf8; --c-duo:#a78bfa; --c-two:#34d399; --c-three:#fb923c; --c-four:#f472b6; }

/* ───── base ───── */
* { box-sizing:border-box; }
html, body { margin:0; color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
body { min-height:100dvh; background:radial-gradient(1100px 560px at 0% -12%, var(--glow1), transparent 62%), radial-gradient(900px 520px at 110% -4%, var(--glow2), transparent 60%), var(--bg); background-attachment:fixed; }
main, .shell { max-width:520px; margin:0 auto; padding:64px 16px 32px; display:flex; flex-direction:column; gap:16px; }
.shell { padding-top:80px; }
h1, h2, h3 { margin:0; }
h2 { font-family:var(--display); font-weight:800; font-size:1.5rem; letter-spacing:-.01em; line-height:1.15; }
h3 { font-size:.78rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
.title { font-family:var(--display); font-weight:800; font-size:clamp(1.9rem, 6vw, 2.6rem); letter-spacing:-.02em; line-height:1.05; }
.muted { color:var(--muted); } .small { font-size:.85rem; } .warn { color:var(--danger); } .mono { font-family:ui-monospace, monospace; letter-spacing:.08em; }
.center { text-align:center; align-items:center; justify-content:center; min-height:58dvh; display:flex; flex-direction:column; gap:12px; }
.center-text { text-align:center; }
.screen { animation:enter .24s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity:0; transform:translateY(8px); } }

/* ───── controls ───── */
.btn { min-height:48px; padding:0 20px; border-radius:14px; border:1px solid var(--line2); background:var(--raised); color:var(--fg); font:inherit; font-weight:650; cursor:pointer; transition:transform .12s, filter .15s, background .15s; box-shadow:var(--shadow); }
.btn:active:not(:disabled) { transform:scale(.97); }
.btn.primary { background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); color:var(--accent-fg); border-color:transparent; }
.btn.ghost { background:transparent; border-style:dashed; box-shadow:none; color:var(--muted); }
.btn.danger { background:var(--danger); color:#fff; border-color:transparent; }
.btn.big { min-height:58px; font-size:1.08rem; width:100%; font-family:var(--display); font-weight:800; letter-spacing:.01em; }
.btn:disabled { opacity:.42; cursor:default; }
.link { background:none; border:0; color:var(--muted); font:inherit; padding:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.link-plain { background:none; border:0; color:inherit; font:inherit; padding:0; cursor:pointer; text-align:left; flex:1; }
.back { align-self:flex-start; padding-left:0; text-decoration:none; }
.icon { background:none; border:0; min-width:40px; min-height:40px; font-size:1.05rem; cursor:pointer; color:var(--fg); border-radius:10px; }
.icon:hover { background:var(--raised); }
input, select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line2); border-radius:14px; min-height:48px; padding:0 14px; outline:none; transition:border-color .15s, box-shadow .15s; }
input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
input[type=checkbox] { min-height:auto; width:20px; height:20px; accent-color:var(--accent); }
.row { display:flex; gap:8px; } .row input { flex:1; min-width:0; }
.center-row { justify-content:center; flex-wrap:wrap; align-items:center; }
.field { display:flex; flex-direction:column; gap:6px; flex:1; } .field span { font-size:.8rem; color:var(--muted); font-weight:600; }
.code { text-transform:uppercase; letter-spacing:.45em; font-size:1.35rem; font-weight:800; text-align:center; padding-left:.45em; font-family:var(--display); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); }
.soft { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; text-align:center; color:var(--muted); margin:0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.chip { background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:.86rem; }
.chip.pickable { cursor:pointer; color:var(--fg); font:inherit; min-height:40px; }
.chip.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--card)); }
.red { color:#e11d48; }
.tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px; gap:4px; }
.tabs button { flex:1; min-height:40px; border:0; border-radius:10px; background:none; color:var(--muted); font:inherit; font-weight:650; cursor:pointer; }
.tabs button.on { background:var(--raised); color:var(--fg); box-shadow:var(--shadow); }

/* ───── chrome ───── */
.boss-btn { position:fixed; top:10px; left:10px; z-index:20; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter:blur(10px); font-size:1.15rem; cursor:pointer; }
.banner { position:fixed; top:10px; left:62px; right:10px; z-index:19; text-align:center; background:var(--danger); color:#fff; border-radius:12px; padding:10px; font-weight:700; }
.toasts { position:fixed; bottom:18px; left:16px; right:16px; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:60; pointer-events:none; }
.toast { background:var(--fg); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:.92rem; font-weight:600; max-width:100%; box-shadow:0 8px 24px #0006; }
.topbar { position:fixed; top:0; left:0; right:0; height:64px; display:flex; align-items:center; gap:10px; padding:0 12px 0 64px; background:color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); z-index:10; }
.gname { flex:1; font-family:var(--display); font-weight:800; font-size:1.05rem; }
.timer { font-variant-numeric:tabular-nums; font-weight:800; font-family:var(--display); background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:3px 12px; } .timer.low { color:#fff; background:var(--danger); border-color:transparent; }
.modal { position:fixed; inset:0; background:#000a; backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; z-index:40; animation:fade .18s; }
@keyframes fade { from { opacity:0; } }
.sheet { background:var(--card); border:1px solid var(--line); width:100%; max-width:520px; max-height:88dvh; overflow:auto; border-radius:24px 24px 0 0; padding:22px 16px 28px; display:flex; flex-direction:column; gap:14px; animation:rise .24s cubic-bezier(.2,.8,.2,1); }
.sheet.tall { min-height:70dvh; } .center-sheet { align-items:center; text-align:center; }
@keyframes rise { from { transform:translateY(24px); opacity:.6; } }
.dots-loader { display:flex; gap:8px; } .dots-loader i { width:10px; height:10px; border-radius:50%; background:var(--accent); animation:bob 1s infinite ease-in-out; } .dots-loader i:nth-child(2) { animation-delay:.15s; } .dots-loader i:nth-child(3) { animation-delay:.3s; }
@keyframes bob { 50% { transform:translateY(-8px); opacity:.5; } }

/* ───── home ───── */
.hero { display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:8px 0 4px; }
.mark { width:76px; height:76px; border-radius:20px; box-shadow:0 14px 40px -10px #ffd23f55; }
.logo { font-family:var(--display); font-weight:800; font-size:clamp(2.6rem, 11vw, 3.4rem); letter-spacing:-.03em; line-height:1; } .logo span { color:var(--accent); }
.tagline { margin:0; color:var(--muted); font-size:1.05rem; }
.me { flex-direction:row; align-items:flex-end; }
.avatar { display:inline-grid; place-items:center; width:38px; height:38px; border-radius:50%; font-size:1.2rem; flex:none; border:0; box-shadow:0 0 0 2px var(--card); }
.avatar.big { width:60px; height:60px; font-size:1.9rem; cursor:pointer; transition:transform .15s; } .avatar.big:active { transform:rotate(-12deg) scale(.95); }
.home-links { display:flex; justify-content:center; flex-wrap:wrap; }
.home-links .link { text-decoration:none; font-weight:600; }

/* ───── lobby ───── */
.room-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.code-tiles { display:flex; gap:6px; } .code-tiles span { width:42px; height:50px; display:grid; place-items:center; background:var(--raised); border:1px solid var(--line2); border-radius:12px; font-family:var(--display); font-weight:800; font-size:1.6rem; color:var(--accent); box-shadow:var(--shadow); }
.code-tiles.big span { width:50px; height:60px; font-size:2rem; }
.crew-banner { display:flex; align-items:center; gap:8px; background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, var(--card)), var(--card)); border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius:14px; padding:10px 14px; color:var(--fg); font:inherit; text-align:left; cursor:pointer; }
.crew-banner.ghost { background:var(--card); border:1px dashed var(--line2); color:var(--muted); }
.players { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.players li, .rows li { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 10px; min-height:54px; }
.players li.away, .players li.disconnected { opacity:.5; }
.pname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.score, .pts { font-weight:800; font-variant-numeric:tabular-nums; font-family:var(--display); min-width:3ch; text-align:right; } .pts.neg { color:var(--danger); }
.rank { width:2ch; text-align:center; font-weight:800; color:var(--muted); }
.rows { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.group, .col { display:flex; flex-direction:column; gap:10px; }
.carousel { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 6px; scrollbar-width:none; }
.game-card { --c:var(--accent); flex:0 0 74%; scroll-snap-align:start; display:flex; flex-direction:column; gap:4px; text-align:left; background:linear-gradient(160deg, color-mix(in srgb, var(--c) 14%, var(--card)) 0%, var(--card) 55%); color:var(--fg); border:1px solid var(--line); border-radius:20px; padding:14px; font:inherit; cursor:pointer; position:relative; transition:transform .15s, border-color .15s; box-shadow:var(--shadow); }
.game-card[data-cat=solo] { --c:var(--c-solo); } .game-card[data-cat=duo] { --c:var(--c-duo); } .game-card[data-cat=two] { --c:var(--c-two); } .game-card[data-cat=three] { --c:var(--c-three); } .game-card[data-cat=four] { --c:var(--c-four); }
.game-card b { font-family:var(--display); font-weight:800; font-size:1.12rem; }
.game-card.sel { border-color:var(--c); box-shadow:0 0 0 2px var(--c), var(--shadow); }
.game-card:active:not(:disabled) { transform:scale(.98); }
.game-card:disabled { opacity:.45; cursor:default; }
.gicon { font-size:1.6rem; width:46px; height:46px; display:grid; place-items:center; border-radius:14px; background:color-mix(in srgb, var(--c) 22%, transparent); margin-bottom:4px; }
.settings-row { display:flex; flex-wrap:wrap; gap:10px 18px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; }
.setting { display:flex; align-items:center; gap:8px; font-size:.95rem; }
.crew-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; color:var(--fg); font:inherit; cursor:pointer; text-align:left; } .crew-row b { flex:1; }
.crest { width:36px; height:36px; display:grid; place-items:center; border-radius:10px; background:var(--accent-soft); }
.qr { background:#fff; border-radius:16px; padding:10px; width:min(72vw, 280px); aspect-ratio:1; display:grid; place-items:center; color:#333; } .qr img { width:100%; height:100%; image-rendering:pixelated; }

/* ───── results ───── */
.podium { display:flex; align-items:flex-end; justify-content:center; gap:8px; margin-top:8px; }
.step { flex:1; max-width:150px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; animation:enter .5s cubic-bezier(.2,.8,.2,1) backwards; }
.step .pname { max-width:100%; text-align:center; font-size:.9rem; }
.step .block { width:100%; border-radius:14px 14px 4px 4px; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:1.8rem; color:#0008; }
.step.s0 { animation-delay:.25s; } .step.s0 .block { height:120px; background:linear-gradient(180deg, #ffe27a, #f5b800); } .step.s0 .avatar { width:54px; height:54px; font-size:1.7rem; }
.step.s1 { animation-delay:.1s; } .step.s1 .block { height:84px; background:linear-gradient(180deg, #e5e7eb, #9ca3af); }
.step.s2 { animation-delay:.4s; } .step.s2 .block { height:62px; background:linear-gradient(180deg, #fdba74, #c2410c); }

/* ───── game: shared ───── */
.prompt { font-family:var(--display); font-size:1.4rem; font-weight:800; line-height:1.25; margin:0; }
.quote { margin:0; font-size:1.35rem; font-weight:650; background:var(--card); border-left:4px solid var(--accent); border-radius:14px; padding:16px; }
.bubble { background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-weight:600; margin:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
.grid button { display:flex; align-items:center; gap:8px; padding:8px; min-height:56px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
.grid button.sel { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--card)); }
.reacts { display:flex; gap:8px; justify-content:center; } .reacts button { font-size:1.6rem; width:54px; height:54px; border-radius:14px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
.big-count { font-family:var(--display); font-weight:800; font-size:4.5rem; line-height:1; text-align:center; }
.big-count .timer { all:unset; }

/* tap duel */
.tap { height:calc(100dvh - 110px); border-radius:28px; display:grid; place-items:center; background:var(--card); border:1px solid var(--line); user-select:none; touch-action:manipulation; cursor:pointer; font-family:var(--display); font-size:2.4rem; text-align:center; padding:16px; transition:background .05s; }
.tap .now { display:none; } .tap[data-go] { background:var(--accent); color:var(--accent-fg); } .tap[data-go] .wait { display:none; } .tap[data-go] .now { display:block; font-size:5rem; }
/* imposter */
.card { min-height:170px; border-radius:22px; border:2px dashed var(--line2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:var(--card); user-select:none; -webkit-user-select:none; touch-action:none; padding:16px; text-align:center; }
.card.open { border-style:solid; border-color:var(--accent); background:linear-gradient(160deg, var(--accent-soft), var(--card)); } .card b { font-family:var(--display); font-size:2rem; }
.clues { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; } .clues li { display:flex; gap:10px; align-items:center; }
/* doodle */
.shell canvas:not(.arena) { width:min(100%, calc(62dvh * 3 / 4)); max-width:none; height:auto; aspect-ratio:3/4; border-radius:16px; background:#fff; display:block; margin:0 auto; touch-action:none; box-shadow:var(--shadow); }
.tools { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; }
.sw { width:36px; height:36px; border-radius:50%; border:2px solid var(--line2); cursor:pointer; } .sw.sel { outline:3px solid var(--accent); outline-offset:2px; }
.chain { display:grid; gap:10px; }
.entry { display:flex; flex-direction:column; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px; }
.by { display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted); }
.like { align-self:flex-end; min-width:48px; min-height:40px; border-radius:12px; border:1px solid var(--line); background:none; font-size:1.2rem; cursor:pointer; opacity:.6; } .like.on { opacity:1; border-color:var(--accent); background:var(--accent-soft); }
/* bomb, emoji */
.bomb { font-size:5rem; text-align:center; line-height:1.1; }
.big-emoji { font-size:3.8rem; text-align:center; letter-spacing:.08em; padding:12px 0; }
/* tic-tac-toe, four in a row */
.board { display:grid; gap:8px; width:min(100%, 60dvh); margin:0 auto; }
.board.ttt { grid-template-columns:repeat(3, 1fr); } .board.c4 { grid-template-columns:repeat(7, 1fr); gap:6px; background:linear-gradient(180deg, #2546b8, #1e3a8a); padding:10px; border-radius:20px; width:min(100%, 70dvh); box-shadow:var(--shadow); }
.cell { aspect-ratio:1; border-radius:16px; border:1px solid var(--line); background:var(--card); font-size:clamp(1.8rem, 10vw, 3.8rem); font-weight:800; cursor:pointer; display:grid; place-items:center; color:var(--fg); transition:background .15s; }
.cell:not(:disabled):hover { background:var(--raised); }
.c4 .cell { border-radius:50%; background:#0b1230; border:0; padding:3px; box-shadow:inset 0 3px 6px #0008; }
.cell:disabled { cursor:default; } .cell.win { outline:3px solid var(--accent); outline-offset:-3px; }
.disc { width:100%; height:100%; border-radius:50%; display:block; box-shadow:inset 0 -4px 0 #0003; animation:drop .32s cubic-bezier(.5,0,.7,1.4); }
@keyframes drop { from { transform:translateY(-240%); } }
/* chess */
.chess { display:grid; grid-template-columns:repeat(8, 1fr); width:min(100%, 62dvh); margin:0 auto; border-radius:12px; overflow:hidden; box-shadow:var(--shadow), 0 0 0 3px var(--line2); }
.sq { aspect-ratio:1; border:0; padding:0; display:grid; place-items:center; cursor:pointer; position:relative; }
.sq.lt { background:#eeeed2; } .sq.dk { background:#769656; } .sq.last { box-shadow:inset 0 0 0 100px #f6f66966; }
.sq.sel { box-shadow:inset 0 0 0 4px var(--accent); } .sq.tgt::after { content:''; position:absolute; width:30%; height:30%; border-radius:50%; background:#0005; }
.pc { font-size:clamp(1.4rem, 8.5vw, 2.9rem); line-height:1; } .pc.w { color:#fff; text-shadow:0 0 2px #000, 0 0 1px #000, 0 1px 2px #000; } .pc.b { color:#111; }
.clockbar { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; width:min(100%, 62dvh); margin:0 auto; }
.clockbar b { font-variant-numeric:tabular-nums; font-size:1.25rem; font-family:var(--display); } .clockbar.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
/* dots & boxes */
.dots-board { width:min(100%, 62dvh); display:block; margin:0 auto; touch-action:manipulation; }
.dots-board .dotpt { fill:var(--fg); }

/* arena games, red light, tug of war */
